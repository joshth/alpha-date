<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #0ea5e9; }
      .foreground { fill: white; }
      .accent { fill: #fbbf24; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0284c7; }
      .foreground { fill: white; }
      .accent { fill: #fbbf24; }
    }
  </style>

  <!-- Background rounded square -->
  <rect class="background" width="180" height="180" rx="40" />

  <!-- Sparkle Icon - Center -->
  <g transform="translate(90, 90)">
    <!-- Main sparkle star -->
    <path class="foreground"
      d="M0 -35 C2 -28 4 -25 5 -22 C6 -19 8 -16 10 -14 C8 -12 6 -10 5 -7 C4 -4 2 -1 0 2 C-2 -1 -4 -4 -5 -7 C-6 -10 -8 -12 -10 -14 C-8 -16 -6 -19 -5 -22 C-4 -25 -2 -28 0 -35Z"
      transform="rotate(0)"
    />

    <!-- Secondary sparkles -->
    <circle class="accent" cx="25" cy="-20" r="5" opacity="0.9" />
    <circle class="accent" cx="-22" cy="18" r="4" opacity="0.8" />
    <circle class="foreground" cx="-18" cy="-25" r="3" opacity="0.7" />
    <circle class="foreground" cx="28" cy="15" r="3.5" opacity="0.8" />

    <!-- Tiny accent sparkles -->
    <circle class="accent" cx="0" cy="-45" r="2" opacity="0.6" />
    <circle class="accent" cx="35" cy="0" r="2.5" opacity="0.7" />
    <circle class="foreground" cx="-35" cy="-8" r="2" opacity="0.5" />
    <circle class="foreground" cx="8" cy="38" r="2" opacity="0.6" />
  </g>

  <!-- Subtle "G" and "A" letters in bottom corner (subtle branding) -->
  <text x="25" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" class="foreground" opacity="0.4">GA</text>
</svg>
