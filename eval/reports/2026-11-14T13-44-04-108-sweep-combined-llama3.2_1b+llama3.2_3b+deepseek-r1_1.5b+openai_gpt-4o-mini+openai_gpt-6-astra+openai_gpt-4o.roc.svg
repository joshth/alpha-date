<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 568" width="416" height="568" role="img" aria-labelledby="t d">
<title id="t">ROC: real slang vs everything else</title>
<desc id="d">ROC curves: recall against false-accept rate for llama3.2:1b (AUC 0.50), llama3.2:3b (AUC 0.71), openai:gpt-4o-mini (AUC 0.84), openai:gpt-6-astra (AUC 0.98), openai:gpt-4o (AUC 0.89).</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--muted:#52514e;--rule:#e4e3df;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--surface)}
.line.s0{stroke:#2a78d6} circle.s0{fill:#2a78d6;stroke:var(--surface);stroke-width:2}.line.s1{stroke:#eb6834} circle.s1{fill:#eb6834;stroke:var(--surface);stroke-width:2}.line.s2{stroke:#1baf7a} circle.s2{fill:#1baf7a;stroke:var(--surface);stroke-width:2}.line.s3{stroke:#eda100} circle.s3{fill:#eda100;stroke:var(--surface);stroke-width:2}.line.s4{stroke:#e87ba4} circle.s4{fill:#e87ba4;stroke:var(--surface);stroke-width:2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--muted:#c3c2b7;--rule:#3a3936}.line.s0{stroke:#3987e5} circle.s0{fill:#3987e5;stroke:var(--surface);stroke-width:2}.line.s1{stroke:#d95926} circle.s1{fill:#d95926;stroke:var(--surface);stroke-width:2}.line.s2{stroke:#199e70} circle.s2{fill:#199e70;stroke:var(--surface);stroke-width:2}.line.s3{stroke:#c98500} circle.s3{fill:#c98500;stroke:var(--surface);stroke-width:2}.line.s4{stroke:#d55181} circle.s4{fill:#d55181;stroke:var(--surface);stroke-width:2}}
.grid{stroke:var(--rule);stroke-width:1}
.axis{stroke:var(--muted);stroke-width:1}
.chance{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.line{fill:none;stroke-width:2;stroke-linejoin:round}
.tick{fill:var(--muted);font-size:11px}
.label{fill:var(--muted);font-size:12px}
.legend{fill:var(--ink);font-size:13px}
.head{fill:var(--ink);font-size:15px;font-weight:600}
.hit:hover circle:last-of-type{r:6}
</style>
<text class="head" x="64" y="24">ROC: real slang vs everything else</text>
<text class="label" x="64" y="42">Higher and further left is better. Dashed line = coin flip.</text>
